name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and Format Check
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Build client bundles
        run: bun run build:client

      - name: Ensure committed bundles match source (no drift)
        run: git diff --exit-code public/

      - name: Run Unit Tests
        run: bun test
