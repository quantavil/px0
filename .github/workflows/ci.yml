name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and Format Check
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Build client bundles and stylesheets
        run: bun run build

      - name: Ensure committed bundles match source (no drift)
        run: git diff --exit-code public/

      - name: Run Unit Tests
        run: bun run test

      - name: Test Cloudflare storage integration
        run: bun run test:worker

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and accessibility regressions
        run: bun run test:e2e
